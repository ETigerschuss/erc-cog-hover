<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040" font-family="Inter, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B2D8E"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7D6B"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/>
    </marker>
    <pattern id="facets" width="14" height="12" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="6" r="3" fill="#8E6A3C" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1700" height="1040" fill="#FFFFFF"/>

  <!-- ===================== a: natural experiment ===================== -->
  <rect x="20" y="20" width="500" height="770" rx="16" fill="#F2F8F5" stroke="#2E7D6B" stroke-width="3"/>
  <text x="40" y="60" font-size="32" font-weight="700" fill="#1F5F50">a  The natural experiment</text>
  <text x="40" y="94" font-size="24" fill="#1F5F50">one genome, two visual machines</text>

  <!-- female head -->
  <g>
    <ellipse cx="270" cy="245" rx="170" ry="122" fill="#F7EBD3" stroke="#B59A6A" stroke-width="2"/>
    <ellipse cx="185" cy="245" rx="66" ry="96" fill="#C9A06A" stroke="#7A5A2E" stroke-width="3"/>
    <ellipse cx="185" cy="245" rx="66" ry="96" fill="url(#facets)"/>
    <ellipse cx="355" cy="245" rx="66" ry="96" fill="#C9A06A" stroke="#7A5A2E" stroke-width="3"/>
    <ellipse cx="355" cy="245" rx="66" ry="96" fill="url(#facets)"/>
    <ellipse cx="355" cy="245" rx="50" ry="78" fill="none" stroke="#E0B000" stroke-width="3" stroke-dasharray="6 5"/>
    <!-- MOS: rim -> antenna base (up, medial); MOT: rim -> tentorium (down) -->
    <line x1="320" y1="190" x2="296" y2="152" stroke="#C62828" stroke-width="7" stroke-linecap="round"/>
    <text x="236" y="150" font-size="21" font-weight="700" fill="#C62828">MOS</text>
    <line x1="320" y1="300" x2="296" y2="340" stroke="#C62828" stroke-width="7" stroke-linecap="round"/>
    <text x="236" y="360" font-size="21" font-weight="700" fill="#C62828">MOT</text>
    <!-- broad HSN receptive field -->
    <ellipse cx="355" cy="245" rx="58" ry="84" fill="#2F5597" opacity="0.18"/>
    <text x="330" y="252" font-size="21" font-weight="700" fill="#2F5597">HSN</text>
    <text x="40" y="402" font-size="25" font-weight="700" fill="#1F5F50">♀  hover, feed, lay eggs</text>
    <text x="40" y="430" font-size="21" fill="#333">2 retinal muscles · broad HSN field</text>
  </g>

  <!-- male head -->
  <g>
    <text x="40" y="470" font-size="20" font-weight="700" fill="#8A6D00">bright zone</text>
    <line x1="160" y1="464" x2="206" y2="486" stroke="#8A6D00" stroke-width="2"/>
    <ellipse cx="270" cy="575" rx="170" ry="122" fill="#F7EBD3" stroke="#B59A6A" stroke-width="2"/>
    <ellipse cx="204" cy="575" rx="66" ry="96" fill="#C9A06A" stroke="#7A5A2E" stroke-width="3"/>
    <ellipse cx="204" cy="575" rx="66" ry="96" fill="url(#facets)"/>
    <ellipse cx="336" cy="575" rx="66" ry="96" fill="#C9A06A" stroke="#7A5A2E" stroke-width="3"/>
    <ellipse cx="336" cy="575" rx="66" ry="96" fill="url(#facets)"/>
    <!-- bright zones (dorso-frontal, near the midline) -->
    <path d="M204,479 A66,96 0 0 1 268,548 L242,566 L204,528 Z" fill="#FFE27A" opacity="0.92"/>
    <path d="M336,479 A66,96 0 0 0 272,548 L298,566 L336,528 Z" fill="#FFE27A" opacity="0.92"/>
    <ellipse cx="336" cy="575" rx="50" ry="78" fill="none" stroke="#E0B000" stroke-width="3" stroke-dasharray="6 5"/>
    <!-- MOS and MOT on the right eye -->
    <line x1="376" y1="508" x2="402" y2="470" stroke="#C62828" stroke-width="7" stroke-linecap="round"/>
    <text x="408" y="468" font-size="21" font-weight="700" fill="#C62828">MOS</text>
    <line x1="376" y1="640" x2="402" y2="680" stroke="#C62828" stroke-width="7" stroke-linecap="round"/>
    <text x="408" y="700" font-size="21" font-weight="700" fill="#C62828">MOT</text>
    <!-- MIO between the two eyes -->
    <line x1="270" y1="536" x2="270" y2="616" stroke="#C62828" stroke-width="10" stroke-linecap="round"/>
    <text x="248" y="652" font-size="21" font-weight="700" fill="#C62828">MIO</text>
    <!-- narrow HSN field inside the bright zone -->
    <ellipse cx="310" cy="528" rx="26" ry="32" fill="#2F5597" opacity="0.30"/>
    <text x="290" y="535" font-size="19" font-weight="700" fill="#2F5597">HSN</text>
    <text x="40" y="722" font-size="25" font-weight="700" fill="#1F5F50">♂  pursue mates</text>
    <text x="40" y="750" font-size="21" fill="#333">3 retinal muscles incl. the male-only MIO</text>
    <text x="40" y="776" font-size="21" fill="#333">bright zone · narrow HSN field</text>
  </g>

  <!-- ===================== b: modelling ladder ===================== -->
  <rect x="560" y="20" width="540" height="770" rx="16" fill="#EEF3FB" stroke="#2F5597" stroke-width="3"/>
  <text x="580" y="60" font-size="32" font-weight="700" fill="#1F3F7A">b  Modelling ladder</text>
  <text x="580" y="94" font-size="24" fill="#1F3F7A">WP1 · connectome → spiking circuit</text>
  <rect x="990" y="36" width="90" height="40" rx="20" fill="#2F5597"/>
  <text x="1035" y="64" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">H1</text>

  <rect x="580" y="110" width="500" height="68" rx="10" fill="#fff" stroke="#2F5597" stroke-width="2"/>
  <text x="830" y="138" font-size="23" font-weight="700" fill="#1F3F7A" text-anchor="middle">Connectomes: ♀ FlyWire + ♂ MaleCNS</text>
  <text x="830" y="165" font-size="20" fill="#333" text-anchor="middle">chemical synapses, cell types, morphology</text>

  <rect x="580" y="196" width="500" height="68" rx="10" fill="#fff" stroke="#2F5597" stroke-width="2"/>
  <text x="830" y="224" font-size="23" font-weight="700" fill="#1F3F7A" text-anchor="middle">MESH: electrical synapses</text>
  <text x="830" y="251" font-size="20" fill="#333" text-anchor="middle">membrane appositions → EM proofreading</text>

  <line x1="830" y1="264" x2="830" y2="292" stroke="#333" stroke-width="3" marker-end="url(#arr)"/>
  <text x="846" y="284" font-size="18" fill="#555">fit by differentiable simulation</text>

  <rect x="600" y="296" width="460" height="68" rx="10" fill="#DCE6F6" stroke="#2F5597" stroke-width="2"/>
  <text x="830" y="324" font-size="23" font-weight="700" fill="#1F3F7A" text-anchor="middle">Tier 1 · biophysical</text>
  <text x="830" y="351" font-size="20" fill="#333" text-anchor="middle">gap-junction conductance ∝ contact area</text>
  <line x1="830" y1="364" x2="830" y2="392" stroke="#333" stroke-width="3" marker-end="url(#arr)"/>
  <text x="846" y="384" font-size="18" fill="#555">reduce: KAN → equations</text>

  <rect x="600" y="396" width="460" height="68" rx="10" fill="#C9D8F0" stroke="#2F5597" stroke-width="2"/>
  <text x="830" y="424" font-size="23" font-weight="700" fill="#1F3F7A" text-anchor="middle">Tier 2 · reduced</text>
  <text x="830" y="451" font-size="20" fill="#333" text-anchor="middle">LIF + gap junctions; ≥10× fewer variables</text>
  <line x1="830" y1="464" x2="830" y2="492" stroke="#333" stroke-width="3" marker-end="url(#arr)"/>
  <text x="846" y="484" font-size="18" fill="#555">train: surrogate gradients</text>

  <rect x="600" y="496" width="460" height="68" rx="10" fill="#B4C8EA" stroke="#2F5597" stroke-width="2"/>
  <text x="830" y="524" font-size="23" font-weight="700" fill="#1F3F7A" text-anchor="middle">Tier 3 · trainable SNN</text>
  <text x="830" y="551" font-size="20" fill="#333" text-anchor="middle">connectome-masked, task-trainable</text>

  <rect x="600" y="582" width="460" height="52" rx="10" fill="#fff" stroke="#2F5597" stroke-width="2"/>
  <text x="830" y="602" font-size="20" font-weight="700" fill="#1F3F7A" text-anchor="middle">motor readout</text>
  <text x="830" y="624" font-size="19" fill="#333" text-anchor="middle">muscle pull → retinal shift; efference copy</text>

  <rect x="580" y="660" width="500" height="110" rx="10" fill="#FFF9DB" stroke="#B8860B" stroke-width="2"/>
  <text x="830" y="692" font-size="23" font-weight="700" fill="#7A5A00" text-anchor="middle">Controversial-stimulus engine</text>
  <text x="830" y="721" font-size="20" fill="#333" text-anchor="middle">differentiable detectors; stimuli on which</text>
  <text x="830" y="748" font-size="20" fill="#333" text-anchor="middle">competing models disagree most → c, e</text>

  <!-- ===================== c: test in the animal ===================== -->
  <rect x="1140" y="20" width="540" height="270" rx="16" fill="#F2F8F5" stroke="#2E7D6B" stroke-width="3"/>
  <text x="1160" y="60" font-size="32" font-weight="700" fill="#1F5F50">c  Test in the animal</text>
  <text x="1160" y="92" font-size="24" fill="#1F5F50">WP2 · Eristalis, MPI-BI + LMU</text>
  <rect x="1530" y="36" width="130" height="40" rx="20" fill="#2E7D6B"/>
  <text x="1595" y="64" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">H2 · H2b</text>
  <text x="1160" y="126" font-size="20" fill="#333">• competing ♂ circuits: HSN → MIO? HSNE? VS?</text>
  <text x="1160" y="153" font-size="20" fill="#333">• tethered ♂/♀: retinal tracking, EMG of</text>
  <text x="1180" y="180" font-size="20" fill="#333">MOT, MOS and MIO; neurobiotin fills</text>
  <text x="1160" y="207" font-size="20" fill="#333">• high risk: retinal tracking in free flight</text>
  <text x="1160" y="234" font-size="20" fill="#333">• origin of the MIO: development and genes;</text>
  <text x="1180" y="261" font-size="20" fill="#333">the motor neuron as inducer (LMU)</text>

  <!-- ===================== d: explain ===================== -->
  <rect x="1140" y="306" width="540" height="228" rx="16" fill="#F3EEFA" stroke="#6A4C93" stroke-width="3"/>
  <text x="1160" y="346" font-size="32" font-weight="700" fill="#4B3570">d  Explain</text>
  <text x="1160" y="378" font-size="24" fill="#4B3570">WP3 · why dimorphic?</text>
  <rect x="1570" y="322" width="90" height="40" rx="20" fill="#6A4C93"/>
  <text x="1615" y="350" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">H3</text>
  <text x="1160" y="412" font-size="20" fill="#333">• same wiring prior and energy budget, trained</text>
  <text x="1180" y="439" font-size="20" fill="#333">for pursuit (♂ task) or stabilisation (♀ task)</text>
  <text x="1160" y="466" font-size="20" fill="#333">• do bright-zone integration and a third</text>
  <text x="1180" y="493" font-size="20" fill="#333">effector emerge only for pursuit?</text>
  <text x="1160" y="520" font-size="20" fill="#333">• ablation, mean-field, KAN readouts → motifs</text>

  <!-- ===================== e: transfer ===================== -->
  <rect x="1140" y="550" width="540" height="240" rx="16" fill="#FFF1E6" stroke="#C55A11" stroke-width="3"/>
  <text x="1160" y="590" font-size="32" font-weight="700" fill="#8A3D00">e  Transfer to machines</text>
  <text x="1160" y="622" font-size="24" fill="#8A3D00">WP4 · active event-based vision</text>
  <rect x="1570" y="566" width="90" height="40" rx="20" fill="#C55A11"/>
  <text x="1615" y="594" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">H4</text>
  <text x="1160" y="656" font-size="20" fill="#333">• event camera on a micro-movement stage;</text>
  <text x="1180" y="683" font-size="20" fill="#333">fixed vs fly-derived vs learned policies</text>
  <text x="1160" y="710" font-size="20" fill="#333">• motif SNNs on neuromorphic chips (sub-mW)</text>
  <text x="1160" y="737" font-size="20" fill="#333">• benchmarks vs matched deep networks:</text>
  <text x="1180" y="764" font-size="20" fill="#333">small targets · ego-motion · quadrotor</text>

  <!-- ===================== f: validate at scale ===================== -->
  <rect x="20" y="820" width="1660" height="200" rx="16" fill="#F6EEF9" stroke="#7B2D8E" stroke-width="3"/>
  <text x="40" y="860" font-size="32" font-weight="700" fill="#5A1F6B">f  Validate at scale, with people</text>
  <text x="540" y="860" font-size="24" fill="#5A1F6B">WP5 · courses, robot zoo, community proofreading, hoverfly watch</text>

  <rect x="40" y="884" width="390" height="118" rx="10" fill="#fff" stroke="#7B2D8E" stroke-width="2"/>
  <text x="56" y="914" font-size="22" font-weight="700" fill="#5A1F6B">IU computer-vision courses</text>
  <text x="56" y="942" font-size="20" fill="#333">students build one motif per semester;</text>
  <text x="56" y="968" font-size="20" fill="#333">remote students get kits by mail</text>

  <rect x="440" y="884" width="420" height="118" rx="10" fill="#fff" stroke="#7B2D8E" stroke-width="2"/>
  <text x="456" y="914" font-size="22" font-weight="700" fill="#5A1F6B">Robot zoo</text>
  <text x="456" y="940" font-size="20" fill="#333">♂-, ♀- and fly-type circuits on</text>
  <text x="456" y="964" font-size="20" fill="#333">low-cost camera robots:</text>
  <text x="456" y="988" font-size="20" fill="#333">thousands of real-world trials</text>

  <rect x="870" y="884" width="385" height="118" rx="10" fill="#fff" stroke="#7B2D8E" stroke-width="2"/>
  <text x="886" y="914" font-size="22" font-weight="700" fill="#5A1F6B">Community proofreading</text>
  <text x="886" y="942" font-size="20" fill="#333">citizens check candidate electrical</text>
  <text x="886" y="968" font-size="20" fill="#333">synapses in the MESH viewer → b</text>

  <rect x="1265" y="884" width="395" height="118" rx="10" fill="#fff" stroke="#7B2D8E" stroke-width="2"/>
  <text x="1281" y="914" font-size="22" font-weight="700" fill="#5A1F6B">Hoverfly watch</text>
  <text x="1281" y="942" font-size="20" fill="#333">smartphone videos of ♂ pursuits</text>
  <text x="1281" y="968" font-size="20" fill="#333">in gardens → task statistics for d</text>

  <!-- ===================== arrows between panels ===================== -->
  <line x1="520" y1="400" x2="560" y2="400" stroke="#333" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="1100" y1="150" x2="1140" y2="150" stroke="#333" stroke-width="4" marker-end="url(#arr)"/>
  <text x="1104" y="140" font-size="16" fill="#555">predict</text>
  <line x1="1140" y1="200" x2="1100" y2="200" stroke="#2E7D6B" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrG)"/>
  <text x="1106" y="222" font-size="16" fill="#2E7D6B">data</text>
  <line x1="1100" y1="430" x2="1140" y2="430" stroke="#333" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="1410" y1="534" x2="1410" y2="550" stroke="#333" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="1410" y1="790" x2="1410" y2="820" stroke="#333" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="1080" y1="710" x2="1140" y2="710" stroke="#B8860B" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrY)"/>
  <line x1="830" y1="820" x2="830" y2="790" stroke="#7B2D8E" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrP)"/>
  <line x1="290" y1="790" x2="290" y2="820" stroke="#333" stroke-width="4" marker-end="url(#arr)"/>
  <text x="302" y="812" font-size="17" fill="#555">models on robots</text>
</svg>
